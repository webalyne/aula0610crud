<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastrar pessoa | CPF Base</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="nav" aria-label="Navegação principal">
        <a class="brand" href="/"
          ><span class="brand__mark" aria-hidden="true">✦</span> CPF Base</a
        >
        <ul class="nav__links">
          <li><a aria-current="page" href="/post/">Cadastrar</a></li>
          <li><a href="/get/">Consultar</a></li>
          <li><a href="/put/">Editar</a></li>
          <li><a href="/delete/">Excluir</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <header class="page-heading">
        <p class="eyebrow">POST /api/pessoas</p>
        <h1>Cadastrar pessoa</h1>
        <p class="lead">
          Preencha os dados abaixo. O CPF deve ser válido e não pode estar
          cadastrado.
        </p>
      </header>
      <section class="panel" aria-labelledby="form-title">
        <h2 id="form-title">Dados do registro</h2>
        <div id="message" class="message" tabindex="-1" hidden></div>
        <form id="person-form" class="form-grid">
          <div class="field">
            <label for="cpf">CPF</label
            ><input
              id="cpf"
              name="cpf"
              inputmode="numeric"
              autocomplete="off"
              placeholder="000.000.000-00"
              data-mask="cpf"
              required
              maxlength="14"
            />
          </div>
          <div class="field">
            <label for="rg">RG</label
            ><input
              id="rg"
              name="rg"
              autocomplete="off"
              placeholder="00.000.000-0"
              required
              maxlength="20"
            />
          </div>
          <div class="field">
            <label for="nome">Nome</label
            ><input
              id="nome"
              name="nome"
              autocomplete="given-name"
              required
              maxlength="60"
            />
          </div>
          <div class="field">
            <label for="sobrenome">Sobrenome</label
            ><input
              id="sobrenome"
              name="sobrenome"
              autocomplete="family-name"
              required
              maxlength="80"
            />
          </div>
          <div class="field">
            <label for="email">E-mail</label
            ><input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
              maxlength="120"
            />
          </div>
          <div class="field">
            <label for="idade">Idade</label
            ><input
              id="idade"
              name="idade"
              type="number"
              min="1"
              max="120"
              required
            />
          </div>
          <div class="field">
            <label for="telefone">Telefone</label
            ><input
              id="telefone"
              name="telefone"
              inputmode="tel"
              autocomplete="tel"
              placeholder="(00) 00000-0000"
              data-mask="telefone"
              required
              maxlength="15"
            />
          </div>
          <div class="field">
            <label for="estado">Estado (UF)</label
            ><input
              id="estado"
              name="estado"
              autocomplete="address-level1"
              placeholder="SP"
              pattern="[A-Za-z]{2}"
              required
              maxlength="2"
            />
          </div>
          <div class="field field--full">
            <label for="rua">Rua e número</label
            ><input
              id="rua"
              name="rua"
              autocomplete="street-address"
              required
              maxlength="120"
            />
          </div>
          <div class="field">
            <label for="bairro">Bairro</label
            ><input id="bairro" name="bairro" required maxlength="80" />
          </div>
          <div class="field">
            <label for="cidade">Cidade</label
            ><input
              id="cidade"
              name="cidade"
              autocomplete="address-level2"
              required
              maxlength="80"
            />
          </div>
          <div class="form-actions field--full">
            <button class="button" type="submit">Salvar cadastro</button
            ><button class="button button--secondary" type="reset">
              Limpar
            </button>
          </div>
        </form>
      </section>
    </main>
    <footer class="site-footer">desenvolvido por Alyne Rodrigues</footer>
    <script src="/js/common.js"></script>
    <script src="/post/script.js"></script>
  </body>
</html>
