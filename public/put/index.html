<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar pessoa | CPF Base</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="nav" aria-label="Navegação principal">
        <a class="brand" href="/"
          ><span class="brand__mark">CPF</span> CPF Base</a
        >
        <ul class="nav__links">
          <li><a href="/post/">Cadastrar</a></li>
          <li><a href="/get/">Consultar</a></li>
          <li><a aria-current="page" href="/put/">Editar</a></li>
          <li><a href="/delete/">Excluir</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <header class="page-heading">
        <p class="eyebrow">PUT /api/pessoas/:id</p>
        <h1>Editar pessoa</h1>
        <p class="lead">
          Busque o cadastro pelo CPF e altere os campos necessários.
        </p>
      </header>
      <section class="panel" aria-labelledby="search-title">
        <h2 id="search-title">Buscar cadastro</h2>
        <form id="search-form" class="search-bar">
          <div class="field">
            <label for="cpf-search">CPF atual</label
            ><input
              id="cpf-search"
              name="cpfSearch"
              inputmode="numeric"
              placeholder="000.000.000-00"
              data-mask="cpf"
              required
              maxlength="14"
            />
          </div>
          <button class="button" type="submit">Carregar dados</button>
        </form>
        <div id="message" class="message" tabindex="-1" hidden></div>
        <form id="person-form" class="form-grid" hidden>
          <input id="person-id" type="hidden" />
          <div class="field">
            <label for="cpf">CPF</label
            ><input
              id="cpf"
              name="cpf"
              inputmode="numeric"
              data-mask="cpf"
              required
              maxlength="14"
            />
          </div>
          <div class="field">
            <label for="rg">RG</label
            ><input id="rg" name="rg" required maxlength="20" />
          </div>
          <div class="field">
            <label for="nome">Nome</label
            ><input id="nome" name="nome" required maxlength="60" />
          </div>
          <div class="field">
            <label for="sobrenome">Sobrenome</label
            ><input id="sobrenome" name="sobrenome" required maxlength="80" />
          </div>
          <div class="field">
            <label for="email">E-mail</label
            ><input
              id="email"
              name="email"
              type="email"
              required
              maxlength="120"
            />
          </div>
          <div class="field">
            <label for="idade">Idade</label
            ><input
              id="idade"
              name="idade"
              type="number"
              min="1"
              max="120"
              required
            />
          </div>
          <div class="field">
            <label for="telefone">Telefone</label
            ><input
              id="telefone"
              name="telefone"
              inputmode="tel"
              data-mask="telefone"
              required
              maxlength="15"
            />
          </div>
          <div class="field">
            <label for="estado">Estado (UF)</label
            ><input
              id="estado"
              name="estado"
              pattern="[A-Za-z]{2}"
              required
              maxlength="2"
            />
          </div>
          <div class="field field--full">
            <label for="rua">Rua e número</label
            ><input id="rua" name="rua" required maxlength="120" />
          </div>
          <div class="field">
            <label for="bairro">Bairro</label
            ><input id="bairro" name="bairro" required maxlength="80" />
          </div>
          <div class="field">
            <label for="cidade">Cidade</label
            ><input id="cidade" name="cidade" required maxlength="80" />
          </div>
          <div class="form-actions field--full">
            <button class="button" type="submit">Salvar alterações</button
            ><button
              id="cancel-edit"
              class="button button--secondary"
              type="button"
            >
              Cancelar
            </button>
          </div>
        </form>
      </section>
    </main>
    <footer class="site-footer">CPF Base · Operação Update</footer>
    <script src="/js/common.js"></script>
    <script src="/put/script.js"></script>
  </body>
</html>
